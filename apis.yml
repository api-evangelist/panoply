aid: panoply
name: Panoply
description: Panoply is a managed cloud data warehouse and ELT (Extract, Load, Transform)
  platform that centralizes data from 100+ sources into a BigQuery- or Redshift-backed
  warehouse. It pairs pre-built SaaS connectors and a customizable Flex Connector with
  a SQL workbench, a code-free Query Builder, and in-platform dashboards, so startups
  and data teams get analytics-ready data without managing infrastructure. Panoply
  is a SQream company, backed by 500 Global, offering SOC 2 Type 2, HIPAA, GDPR, and
  FINRA compliance postures. Its programmable surface is the Flex Connector for ingesting
  external REST APIs; Panoply does not publish a first-party public REST management
  API or OpenAPI specification.
